<!DOCTYPE html>
<html>
    <head>
        <!--STYLES--> 
        <link rel="stylesheet" href="./index.css">

        <!--FONTS-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:opsz,wght@10..72,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
            
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>

    <body>
        <div id="container">
            <header>
                <img src="./assets/parrot.png" alt="pollyglot parrot logo" />
                <div id="header-text">
                    <h1>PollyGlot</h1>
                    <p>Perfect Translation Every Time</p>
                </div>
            </header>
            <main>
                <section id="interface">
                    <div id="chat">
                        <div class="ai chat">
                            <p>Select the language you want me to translate into, type your text and hit send</p>
                        </div>
                    </div>
                    <form id="message-form">
                        <div id="input">
                            <input id="text-input" aria-label="text input" required />
                            <button id="send-btn"><i class="fa fa-paper-plane"></i></button>
                        </div>
                        <fieldset>
                            <div class="image-radio-group">
                                <label>
                                    <input type="radio" id="france" name="language" value="france" checked />
                                    <img src="./assets/fr-flag.png" alt="french option" />
                                </label>
                                <label>
                                    <input type="radio" id="spain" name="language" value="spain" />
                                    <img src="./assets/sp-flag.png" alt="spanish option" />
                                </label>
                                <label>
                                    <input type="radio" id="japan" name="language" value="japan" />
                                    <img src="./assets/jpn-flag.png" alt="japanese option" />
                                </label>
                            </div>
                        </fieldset>
                    </form>
                </section>
            </main>
        </div>
        <script src="./index.js" type="module"></script>
    </body>
</html>
